version: "3"

services:
  next-app:
    container_name: next-app
    build:
      context: ./next-app
      dockerfile: prod.Dockerfile
      args:
        ENV_VARIABLE: ${ENV_VARIABLE}
        NEXT_PUBLIC_ENV_VARIABLE: ${NEXT_PUBLIC_ENV_VARIABLE}
    restart: always
    ports:
      - 3000:3000
    volumes:
      - ./next-app/database:/app/database
      - ./next-app/lib:/app/lib
      - db-data:/app/database/data
    networks:
      - my_network

networks:
  my_network:

volumes:
  db-data:
    driver: local
